experiment_name: epsilon_pure_gcin_1950_2019
seed: 20260701

paths:
  daily_dir: _private/processed/epsilon_training_daily_pure_gcin_1950_2019_parquet
  physics_daily_dir: _private/processed/epsilon_physics_daily_pure_gcin_1950_2019_parquet
  static_attributes: _private/processed/epsilon_model_inputs_pure_gcin_1950_2019/static_attributes.parquet
  lp_gamma: _private/processed/epsilon_model_inputs_pure_gcin_1950_2019/lp_gamma_fit_summary.parquet
  output_dir: _private/results/epsilon_pure_gcin_1950_2019

data:
  start_year: 1950
  end_year: 2019
  pre_window: [1950-01-01, 1990-12-31]
  post_window: [1991-01-01, 2019-12-31]
  forcing_columns:
    - t2m
    - d2m
    - u10
    - v10
    - sp
    - skt
    - swvl1
    - swvl2
    - swvl3
    - lai_hv
    - lai_lv
    - tp
    - ssr
    - str
    - aet
  target_column: qobs_streamflow_mm
  static_columns:
    - longitude
    - latitude
    - area_km2
    - elevation_mean_m
    - mean_slope_degree
    - Median_DepthToBedrock_cm
    - Prec_mm
    - Temp_C
    - PET_mm
    - AET_mm
    - P_AET_mm
    - Aridity
    - max_soil_moisture
    - Porosity
    - Seasonality_of_Moisture_Index
    - low_high_ratio
    - wet_days_ratio_1mm
    - wet_days_ratio_5mm
    - high_prec_freq_10mm
    - high_prec_dur_10mm
    - low_prec_freq_1mm
    - low_prec_dur_1mm

splits:
  n_folds: 5
  strategy: paired_pre_post_temporal_blocks
  purge_context_days: 365

recession:
  min_decline_days: 4
  drop_first_decline_day: true
  decreasing_rate: true
  cold_temperature_filter_C: 0.0
  snow_mask_csv:
  snow_free_threshold: 25.0

physics:
  rho: 365
  bufftime: 365
  dynamic_columns:
    - precipitation_mmd
    - temperature_C
    - pet_mmd
    - SM_%
  target_column: streamflow_mmd
  bounds:
    alpha: [0.0, 1.0]
    lp: [0.1, 1.0]
    gamma: [0.1, 5.0]
    lp_pad: 0.01
    gamma_pad: 0.01

model:
  sequence_length: 365
  hidden_size: 256
  num_layers: 1
  dropout: 0.4
  n_mul: 10

training:
  loss: physics_informed_epsilon_core
  batch_size: 512
  epochs: 30
  learning_rate: 0.0001
  lambda_path: 25.0
  lambda_rhs: 10.0
  lambda_smooth: 0.1
  lambda_q0: 5.0
  huber_delta: 0.5
  checkpoint_selection: final_epoch
  num_workers: 0
  mixed_precision: false

smoke:
  year_start: 1950
  year_end: 2019
  max_catchments: 32
  epochs: 2
  batch_size: 8
  iters_per_epoch: 2
